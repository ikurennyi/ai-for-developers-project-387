name: Implement approved specification

"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  route:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      run: ${{ steps.route.outputs.run }}
      scope: ${{ steps.route.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: route
        run: node tooling/agent-control.mjs route

  implement:
    name: agent-admission:${{ needs.route.outputs.scope }}:interactive
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: implement-spec-${{ needs.route.outputs.scope }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      sha: ${{ steps.gate.outputs.sha }}
      verdict: ${{ steps.model.outputs.verdict }}
      patch_result: ${{ steps.patch.outcome }}
    steps:
      - name: Check out trusted policy, never PR configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: policy
      - name: Verify request, approval, task graph, trust and complete Actions history
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node policy/tooling/agent-control.mjs prepare
      - name: Fetch exact candidate SHA without exposing it to model configuration discovery
        if: steps.gate.outputs.decision == 'allow'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
          path: candidate
      - name: Reject symlink snapshots before model access
        if: steps.gate.outputs.decision == 'allow'
        run: |
          set -euo pipefail
          test -z "$(find candidate -path candidate/.git -prune -o -type l -print)"
      - name: Install isolated pinned OpenCode CLI after admission
        if: steps.gate.outputs.decision == 'allow'
        run: docker build --file policy/tooling/agent-runner/Dockerfile --tag agent-runner policy
      - name: Run model with no GitHub token, shell or head-code execution
        id: model
        if: steps.gate.outputs.decision == 'allow'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGENT_OUTPUT: ${{ runner.temp }}/implementation
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "verdict=infra" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if timeout --kill-after=15s 20m docker run --rm --name "implement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --env HOME=/tmp --env OPENCODE_API_KEY \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/workspace" \
            --mount "type=bind,src=$AGENT_OUTPUT,dst=/context,readonly" \
            agent-runner --model opencode/glm-5.3-flash-free --agent github-implementer \
            "Read /context/context.json. Implement the approved graph or the current human PR fix in /workspace. Complete an internal standards and specification review before the final report. Independent checks and separately authorized publication are runner duties." \
            > "$AGENT_OUTPUT/report.md"; then
            echo "verdict=success" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" = 124 ] || [ "$status" = 137 ]; then verdict=timeout; else verdict=agent_failed; fi
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Stop only this invocation container
        if: always() && steps.gate.outputs.decision == 'allow'
        run: |
          if docker inspect "implement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1; then
            docker stop --time 5 "implement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Validate protected paths and prepare complete patch
        id: patch
        if: steps.model.outputs.verdict == 'success'
        run: node policy/tooling/agent-control.mjs patch candidate
      - name: Save immutable run-scoped implementation evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: implementation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/implementation
          if-no-files-found: error
      - name: Bind publication to this trusted producer log
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          echo "agent-evidence:$ARTIFACT_ID:$ARTIFACT_DIGEST"

  verify:
    needs: implement
    if: needs.implement.outputs.verdict == 'success' && needs.implement.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    services:
      postgres:
        image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: scaffold_ci
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d scaffold_ci"
          --health-interval 1s --health-timeout 3s --health-retries 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.implement.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: implementation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/implementation
      - name: Apply candidate patch, without model or publishing credentials
        run: git apply --check "$RUNNER_TEMP/implementation/implementation.patch" && git apply "$RUNNER_TEMP/implementation/implementation.patch"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential autoconf libssl-dev libyaml-dev zlib1g-dev libreadline-dev libffi-dev libgmp-dev libpq-dev pkg-config
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.6
          cache: false
      - name: Install locked dependencies
        run: |
          mise exec -- gem install bundler -v 4.0.22 --no-document
          mise run install
          mise exec -- node frontend/node_modules/playwright/cli.js install --with-deps chromium
      - name: Recheck policies and complete aggregate
        id: check
        env:
          CI: "true"
          DATABASE_URL: postgresql://ci:ci-ephemeral@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/scaffold_ci
        run: |
          set -euo pipefail
          if timeout --kill-after=15s 20m bash -euo pipefail -c 'mise run ci:validate && mise run check'; then
            echo "verdict=success" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" = 124 ] || [ "$status" = 137 ]; then verdict=timeout; else verdict=agent_failed; fi
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  report:
    if: always() && needs.route.outputs.run == 'true'
    needs: [route, implement, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish no-model verdict, last known SHA and logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          JOB_RESULT: ${{ needs.implement.result }}
          CHECK_RESULT: ${{ needs.verify.result }}
          CHECK_VERDICT: ${{ needs.verify.outputs.verdict }}
          BUDGET_DECISION: ${{ needs.implement.outputs.decision }}
          MODEL_VERDICT: ${{ needs.implement.outputs.verdict }}
          PATCH_RESULT: ${{ needs.implement.outputs.patch_result }}
          LAST_SHA: ${{ needs.implement.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          verdict=infra
          if [ "$BUDGET_DECISION" = limit_exhausted ]; then verdict=limit_exhausted
          elif [ "$JOB_RESULT" = cancelled ] || [ "$CHECK_RESULT" = cancelled ] || [ "$MODEL_VERDICT" = timeout ] || [ "$CHECK_VERDICT" = timeout ]; then verdict=timeout
          elif [ "$MODEL_VERDICT" = agent_failed ]; then verdict=agent_failed
          elif [ "$MODEL_VERDICT" = success ] && [ "$PATCH_RESULT" = failure ]; then verdict=agent_failed
          elif [ "$MODEL_VERDICT" = success ] && [ "$CHECK_VERDICT" = agent_failed ]; then verdict=agent_failed
          elif [ "$MODEL_VERDICT" = success ] && [ "$CHECK_RESULT" = success ]; then verdict=success
          fi
          sha="$LAST_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request_review_comment ] || jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" > /dev/null; then
            sha="$(gh api "repos/$GH_REPO/pulls/$ISSUE_NUMBER" --jq '.head.sha')"
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$verdict; last SHA: ${sha:-unknown}; logs: $url. Нужен человек: проверьте результат и отдельно разрешите публикацию; свежие CI и авторевью требуют подтверждения владельца для GITHUB_TOKEN."
          if [ "$GITHUB_EVENT_NAME" = pull_request_review_comment ]; then
            comment_id="$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")"
            gh api --method POST "repos/$GH_REPO/pulls/comments/$comment_id/replies" -f body="$body"
          else
            gh issue comment "$ISSUE_NUMBER" --body "$body"
          fi
