name: Issue triage

"on":
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    if: >-
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      OPENCODE_MODEL: opencode/deepseek-v4.1-flash-free
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TRIAGE_PROMPT: |
        Perform preliminary triage using the triage skill.
        Check the existing application before recommending a change. Describe
        what exists, what is missing, and ask specific unresolved questions.
        Recommend a category and next state in your Markdown reply; leave the
        decision to proceed to a human. The workflow assigns needs-triage when
        no state is present; this agent can only read GitHub.
        Prepared issues are skipped by the gate. Load the triage skill, but
        perform only its preliminary analysis and questions, not its write steps.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check triage eligibility
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eligible="$(gh issue view "$ISSUE_NUMBER" --json state,labels --jq '
            .state == "OPEN" and
            ([.labels[].name] | any(
              . == "ready-for-agent" or . == "ready-for-human" or
              . == "agent:spec" or . == "agent:ticket" or . == "wontfix"
            ) | not)')"
          echo "run=$eligible" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install --global @opencode/cli@2.3.0

      - name: Collect issue and discussion context
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/opencode-context.md"
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" \
            >> "$RUNNER_TEMP/opencode-context.md"

      - name: Mark as awaiting triage
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_count="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '
            [.labels[].name | select(
              . == "needs-triage" or . == "needs-info" or . == "ready-for-agent" or
              . == "ready-for-human" or . == "wontfix"
            )] | length')"
          if [ "$state_count" = "0" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label needs-triage
          fi

      - name: Run preliminary triage agent
        if: steps.gate.outputs.run == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          opencode run --standalone --archived \
            --model "$OPENCODE_MODEL" \
            --agent github-triage \
            "$TRIAGE_PROMPT Repository: $GH_REPO. Source issue: #$ISSUE_NUMBER. Context: $(cat "$RUNNER_TEMP/opencode-context.md")" \
            > "$RUNNER_TEMP/opencode-response.md"
          test -s "$RUNNER_TEMP/opencode-response.md"

      - name: Publish preliminary triage
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/opencode-response.md"
